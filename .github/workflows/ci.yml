name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Maven — unit, component & integration tests
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers pulls service images (pgvector) from Docker Hub; authenticating avoids the
      # anonymous pull-rate-limit on shared runner IPs. Skipped automatically if the secret is unset.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The local embedding model (all-MiniLM-L6-v2 ONNX, ~87 MB) is gitignored; one
      # full-context test boots it. Fetch once and cache across runs.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: src/main/resources/onnx/all-MiniLM-L6-v2
          key: minilm-onnx-v1
      - name: Fetch embedding model
        run: bash scripts/fetch-model.sh

      # Surefire (unit + component) + failsafe (pgvector Testcontainers integration, *IT).
      - name: Build, unit + component + integration tests
        run: mvn -B -ntp clean verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore
