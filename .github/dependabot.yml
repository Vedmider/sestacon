version: 2
# Policy: auto-propose only minor/patch updates (compatible within the major line we build and
# test against). Major upgrades (e.g. Spring Boot 3 -> 4) are deliberate, human-tested changes,
# never auto-PRs, so CI always validates what we actually ship.
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
